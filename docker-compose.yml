version: '3.8'

services:
  c8_web_app:
    build: .
    container_name: c8_prediction_service
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1
    # 如果需要连接外部 MySQL，取消注释以下配置
    # depends_on:
    #   - mysql
    networks:
      - c8_network
    restart: unless-stopped

  # 可选：如果需要在 Docker 中运行 MySQL
  # mysql:
  #   image: mysql:8.0
  #   container_name: c8_mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: 123456
  #     MYSQL_DATABASE: c8_prediction
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - c8_network
  #   restart: unless-stopped

networks:
  c8_network:
    driver: bridge

